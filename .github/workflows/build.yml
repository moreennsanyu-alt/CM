
name: Build Complete

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  paket-update:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
           fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Adjust to match your SDK version
      
      - name: Restore tools
        run: dotnet tool restore
        
      - name: Install wix
        run: dotnet tool install --global wix --version 6.0.2

      - name: Add wix extensions
        run: wix extension add -g WixToolset.UI.wixext/6.0.2
          
      - name: Prepare Interactive Environment
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "ScreenSaveActive" -Value 0
          
      - name: Run Fallout
        run: dotnet run --project ./.build/_build.csproj
        env:
          NuGetApiKey: ${{ secrets.NUGETAPIKEY }}
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}
          AppKey: ${{ secrets.LICKEY }}
        
        
      - name: Upload test result images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-images
          path: |
            artifacts/attachments/testresults/**/*.png
            artifacts/attachments/testresults/**/*.jpg
            artifacts/attachments/testresults/**/*.jpeg
            artifacts/attachments/testresults/**/*.gif
            artifacts/attachments/testresults/**/*.bmp
            artifacts/attachments/testresults/**/*.avi
          if-no-files-found: ignore
        
    
