name: E2E Video Capture

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/ClinicManager.E2E.Tests/**'
      - '.github/workflows/e2e-video.yml'

jobs:
  e2e-video:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run E2E video test
        shell: pwsh
        run: |
          dotnet run --project tests/ClinicManager.E2E.Tests/ClinicManager.E2E.Tests.csproj

      - name: Zip recorded video
        if: always()
        shell: pwsh
        run: |
          $sourceRoot = "."
          $artifactDirectory = "artifacts"
          $outputZip = Join-Path $artifactDirectory "e2e-videos.zip"

          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null

          $videoFiles = Get-ChildItem -Path $sourceRoot -Recurse -File -Include *.mp4, *.avi -ErrorAction SilentlyContinue

          if ($videoFiles.Count -gt 0) {
            Compress-Archive -Path $videoFiles.FullName -DestinationPath $outputZip -Force
          }
          else {
            Write-Host "No .mp4 or .avi files were found under $sourceRoot"
          }
      - name: Upload browser video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-video-artifact
          path: artifacts/e2e-videos.zip
          if-no-files-found: ignore
