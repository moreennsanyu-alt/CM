
name: .NET Core Desktop

on:
  push:
    paths:
      - 'template.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write    

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: your-solution-name                         # Replace with your solution name, i.e. MyWpfApp.sln.
      Test_Project_Path: your-test-project-path                 # Replace with the path to your test project, i.e. MyWpfApp.Tests\MyWpfApp.Tests.csproj.
      Wap_Project_Directory: your-wap-project-directory-name    # Replace with the Wap project directory relative to the solution, i.e. MyWpfApp.Package.
      Wap_Project_Path: your-wap-project-path                   # Replace with the path to your Wap project, i.e. MyWpf.App.Package\MyWpfApp.Package.wapproj.

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Install templates
    - name: Execute unit tests
      run: dotnet new install DevExpress.XAF.ProjectTemplates::24.2.15

    - name: Execute unit tests
      run: dotnet new dx.xaf -n ClinicManager -o ./Src --no-update-check --type solution -db sqlite -orm XPO -p Win -e2e -s MiddleTier -m All

          
    - name: Create Pull Request
      continue-on-error: true
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
          
        # Branch Configuration
        branch: feature/paket-update
        delete-branch: true
          
        # PR Content
        title: "Paket Dependency Update"
        body: "Hello"
      
        # COMMIT IDENTITY CONFIGURATION
        # This maps the commit to the user who pressed the button
        author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
        committer: GitHub <noreply@github.com>
        commit-message: "chore(deps): update paket dependencies"
          
        # Labels
        labels: |
            dependencies
            manual-trigger
      
